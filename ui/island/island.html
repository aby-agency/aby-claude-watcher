<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Aby Claude Watcher — Island</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="island.css">
</head>
<body>
  <div class="island">
    <div class="pill" id="pill">
      <div class="wing wing-left" id="wingLeft"></div>
      <div class="notch-gap"></div>
      <div class="wing wing-right" id="wingRight"></div>
    </div>
    <div class="banner" id="banner"></div>
    <div class="panel" id="panel">
      <!-- .panel-fold : l'item de grille qui se replie à 0 (voir island.css).
           Il ne porte AUCUN padding — un padding sur l'item empêche la grille
           de le ramener à zéro (18px résiduels sous la pilule fermée). -->
      <div class="panel-fold">
      <div class="panel-inner">
        <div class="rows" id="rows"></div>
        <div class="rows rows-bg" id="rowsBg"></div>
        <!-- Barres de conso (5H / 7J / scopés Fable) — colonne aérée. -->
        <div class="ubar-col" id="gauges"></div>
        <!-- Pied : version courante en tout petit, + action de mise à jour
             quand une release plus récente existe. -->
        <div class="island-foot" id="foot"></div>
      </div>
      </div>
    </div>
  </div>
  <script src="../../i18n.js"></script>
  <script src="../usage-ring.js"></script>
  <script src="../../island-model.js"></script>
  <script src="../state-duration.js"></script>
  <script src="island.js"></script>
</body>
</html>
